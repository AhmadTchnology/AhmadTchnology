<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Projects Ahmed is currently building" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="340" rx="16" fill="#0B1E2D"/>
  <rect width="1000" height="48" rx="16" fill="#102F3E"/>
  <rect y="32" width="1000" height="16" fill="#102F3E"/>
  <circle cx="30" cy="24" r="6" fill="#FF6B6B"/>
  <circle cx="52" cy="24" r="6" fill="#FFC857"/>
  <circle cx="74" cy="24" r="6" fill="#5EEAD4"/>
  <text x="500" y="30" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#8FB3BB">utopia-tech: now building</text>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
    <!-- row 1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
      <circle cx="40" cy="92" r="6" fill="#5EEAD4" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="62" y="98" font-size="18" font-weight="700" fill="#E8F1F2">CYD iPod</text>
      <text x="300" y="98" font-size="16" fill="#9CC3CB">ESP32 music player with SD library and Bluetooth audio</text>
    </g>
    <!-- row 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.0s" fill="freeze"/>
      <circle cx="40" cy="146" r="6" fill="#5EEAD4" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="62" y="152" font-size="18" font-weight="700" fill="#E8F1F2">PSP YouTube</text>
      <text x="300" y="152" font-size="16" fill="#9CC3CB">homebrew client fed by a one-click PC relay server</text>
    </g>
    <!-- row 3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
      <circle cx="40" cy="200" r="6" fill="#5EEAD4" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="62" y="206" font-size="18" font-weight="700" fill="#E8F1F2">uTune Jukebox</text>
      <text x="300" y="206" font-size="16" fill="#9CC3CB">tap an RFID card, a YouTube track joins the queue</text>
    </g>
    <!-- row 4 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
      <circle cx="40" cy="254" r="6" fill="#5EEAD4" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="62" y="260" font-size="18" font-weight="700" fill="#E8F1F2">Assistive Glasses</text>
      <text x="300" y="260" font-size="16" fill="#9CC3CB">sign and speech recognition on a Raspberry Pi 5</text>
    </g>
    <!-- row 5 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.8s" fill="freeze"/>
      <circle cx="40" cy="308" r="6" fill="#5EEAD4" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="62" y="314" font-size="18" font-weight="700" fill="#E8F1F2">Lecture Manager</text>
      <text x="300" y="314" font-size="16" fill="#9CC3CB">university lectures on React, Firebase, and Cloudflare R2</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
