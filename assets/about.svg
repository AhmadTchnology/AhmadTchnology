<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="About Ahmed" xmlns:c2pa="http://c2pa.org/manifest"><defs><filter id="g" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="998" height="148" rx="16" fill="#0B1E2D" stroke="#1F6272" stroke-width="2"/><text x="36" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#E8F1F2" >I build practical systems that solve real problems, especially in education and</text><text x="36" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#B9CFD3" >university life. Most of my work sits where software meets hardware, and I learn</text><text x="36" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#B9CFD3" >by building. Everything ships under the Utopia Tech name.</text><circle r="4" fill="#FFC857" filter="url(#g)"><animateMotion dur="6s" repeatCount="indefinite" path="M20 148 H980"/></circle><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>